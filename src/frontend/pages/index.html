<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:">
    <title>FOC电机控制上位机</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/logger.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部菜单栏 -->
        <header class="header">
            <div class="logo">
                <h1>FOC电机控制上位机</h1>
            </div>
            <div class="status-bar">
                <span id="connection-status" class="status-offline">未连接</span>
                <span id="data-rate">0 Hz</span>
                <div class="logger-icon" id="logger-icon" title="查看日志">
                    <span class="icon">📋</span>
                    <span class="notification-dot" id="logger-notification" style="display: none;">!</span>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 左侧控制侧边栏 -->
            <aside class="sidebar">
                <!-- 串口配置功能栏 -->
                <div class="serial-section">
                    <h3>串口配置</h3>
                    <div class="serial-settings">
                        <select id="serial-port-select">
                            <option value="">选择串口</option>
                        </select>
                        <select id="baud-rate-select">
                            <option value="9600">9600</option>
                            <option value="19200">19200</option>
                            <option value="38400">38400</option>
                            <option value="57600">57600</option>
                            <option value="115200" selected>115200</option>
                            <option value="1500000">1.5M</option>
                        </select>
                        <button id="connect-btn" class="connect-btn">连接</button>
                    </div>
                </div>

                <!-- 打印曲线选择功能栏 -->
                <div class="curve-section">
                    <h3>打印曲线选择</h3>
                    <div class="curve-controls" id="curve-controls">
                        <!-- 曲线选择控件将通过JS动态生成 -->
                    </div>
                </div>

            </aside>

            <!-- 中部图表区域 -->
            <section class="chart-area">
                <!-- 可移动视窗系统 -->
                <div class="viewport-container">
                    <!-- 视窗内容区域 -->
                    <div class="viewport-content">
                        <canvas id="main-chart" width="800" height="400"></canvas>
                    </div>
                    
                    <!-- X轴滚动条 - 下方 -->
                    <div class="viewport-scrollbar x-scrollbar">
                        <div class="scrollbar-track" id="x-scrollbar-track">
                            <div class="scrollbar-thumb" id="x-scrollbar-thumb"></div>
                        </div>
                    </div>
                    
                    <!-- Y轴滚动条 - 右侧 -->
                    <div class="viewport-scrollbar y-scrollbar">
                        <div class="scrollbar-track vertical" id="y-scrollbar-track">
                            <div class="scrollbar-thumb" id="y-scrollbar-thumb"></div>
                        </div>
                    </div>
                    
                    <!-- 缩放控制 -->
                    <div class="viewport-controls">
                        <div class="zoom-controls">
                            <button class="zoom-btn" id="zoom-reset" title="重置视图">⌂</button>
                            <button class="zoom-btn" id="zoom-fit" title="适应数据">⊞</button>
                        </div>
                        <div class="range-display">
                            <span id="x-range-display">0-10s</span>
                            <span id="y-range-display">-10-10</span>
                        </div>
                    </div>
                </div>
                
                <div class="chart-controls">
                    <button id="pause-btn" class="control-btn" title="暂停/继续">
                        <span class="icon">⏸️</span>
                        <span class="text">暂停</span>
                    </button>
                    <button id="clear-btn" class="control-btn" title="清除数据">
                        <span class="icon">🗑️</span>
                        <span class="text">清除</span>
                    </button>
                    <button id="export-btn" class="control-btn" title="导出数据">
                        <span class="icon">📥</span>
                        <span class="text">导出</span>
                    </button>
                    <button id="debug-log-btn" class="control-btn" title="显示/隐藏调试日志" style="background: #28a745;">
                        <span class="icon">🐛</span>
                        <span class="text">调试</span>
                    </button>
                    <button id="export-log-btn" class="control-btn" title="导出调试日志" style="background: #ffc107; color: black;">
                        <span class="icon">📋</span>
                        <span class="text">日志</span>
                    </button>
                </div>
                
                <!-- 数据通信区域 -->
                <div class="data-communication">
                    <div class="comm-section">
                        <div class="section-header">
                            <h4>写入数据</h4>
                        </div>
                        <div class="hex-display-area">
                            <textarea id="send-data-display" readonly placeholder="上位机发送的数据将在此显示（十六进制）..."></textarea>
                        </div>
                        <div class="send-controls">
                            <input type="text" id="hex-input" placeholder="输入十六进制数据（如：01 02 03）" maxlength="200">
                            <button id="send-hex-btn" class="control-btn">发送</button>
                            <button id="clear-send-btn" class="control-btn">清空</button>
                        </div>
                    </div>
                    
                    <div class="comm-section">
                        <div class="section-header">
                            <h4>读取数据</h4>
                            <label class="raw-data-toggle compact">
                                <input type="checkbox" id="show-raw-data" checked>
                                <span>显示原始数据</span>
                            </label>
                        </div>
                        <div class="hex-display-area">
                            <textarea id="receive-data-display" readonly placeholder="上位机接收的数据将在此显示（十六进制）..."></textarea>
                        </div>
                        <div class="receive-controls">
                            <button id="clear-receive-btn" class="control-btn">清空</button>
                            <button id="save-receive-btn" class="control-btn">保存</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 右侧控制面板 -->
            <aside class="control-panel">
                <!-- 模式设置功能栏 -->
                <div class="mode-section">
                    <div class="mode-section-header">
                        <h3>当前模式</h3>
                        <label class="mode-enable-toggle">
                            <input type="checkbox" id="mode-enable-checkbox" checked>
                            <span class="checkmark"></span>
                        </label>
                    </div>
                    
                    <!-- 模式选择 -->
                    <div class="mode-selector">
                        <select id="control-mode-select">
                            <option value="torque">力矩模式</option>
                            <option value="speed">速度模式</option>
                            <option value="position">位置模式</option>
                            <option value="calibration">校准模式</option>
                            <option value="status">状态上报模式</option>
                        </select>
                    </div>

                    <!-- 力矩模式控制 -->
                    <div class="mode-control torque-mode">
                        <h4>力矩控制</h4>
                        <div class="slider-control">
                            <label>力矩值: <span id="torque-value">0</span>%</label>
                            <input type="range" id="torque-slider" min="0" max="100" value="0" step="1">
                        </div>
                    </div>

                    <!-- 速度模式控制 -->
                    <div class="mode-control speed-mode">
                        <h4>速度控制</h4>
                        <div class="slider-control">
                            <label>速度值: <span id="speed-value">0</span>%</label>
                            <input type="range" id="speed-slider" min="0" max="100" value="0" step="1">
                        </div>
                    </div>

                    <!-- 位置模式控制 -->
                    <div class="mode-control position-mode">
                        <h4>位置控制</h4>
                        <div class="slider-control">
                            <label>位置值: <span id="position-value">0.0</span>°</label>
                            <input type="range" id="position-slider" min="0" max="360" value="0" step="0.1">
                        </div>
                    </div>

                    <!-- 校准模式控制 -->
                    <div class="mode-control calibration-mode">
                        <h4>校准模式</h4>
                        <button id="send-calibration-btn" class="send-btn">发送校准指令</button>
                    </div>

                    <!-- 状态上报模式控制 -->
                    <div class="mode-control status-mode">
                        <h4>状态上报模式</h4>
                        <div class="status-info">
                            <p>当前状态：状态上报已启用</p>
                            <p>数据将自动显示在图表区域</p>
                        </div>
                    </div>
                </div>

                <!-- 读写数据功能栏 -->
                <div class="rw-data-section">
                    <h3>读写数据</h3>
                    
                    <!-- 读写选择 -->
                    <div class="rw-mode-selector">
                        <label>
                            <input type="radio" name="rw-mode" value="read" checked> 读取数据
                        </label>
                        <label>
                            <input type="radio" name="rw-mode" value="write"> 写入数据
                        </label>
                    </div>

                    <!-- 数据ID选择 -->
                    <div class="data-id-selector">
                        <label>数据ID:</label>
                        <select id="data-id-select">
                            <option value="0x10">0x10 - A相电流目标值</option>
                            <option value="0x11">0x11 - A相电流当前值</option>
                            <option value="0x12">0x12 - B相电流目标值</option>
                            <option value="0x13">0x13 - B相电流当前值</option>
                            <option value="0x14">0x14 - C相电流目标值</option>
                            <option value="0x15">0x15 - C相电流当前值</option>
                            <option value="0x16">0x16 - 转速目标值</option>
                            <option value="0x17">0x17 - 转速当前值</option>
                            <option value="0x18">0x18 - Q轴电压目标值</option>
                            <option value="0x19">0x19 - Q轴电压当前值</option>
                            <option value="0x1A">0x1A - D轴电压目标值</option>
                            <option value="0x1B">0x1B - D轴电压当前值</option>
                            <option value="0x1C">0x1C - 最大电流限制</option>
                            <option value="0x1D">0x1D - 电机母线电压</option>
                            <option value="0x1E">0x1E - 电机极对数</option>
                            <option value="0x1F">0x1F - 电角度目标值</option>
                            <option value="0x20">0x20 - 电角度当前值</option>
                            <option value="0x21">0x21 - 机械角度目标值</option>
                            <option value="0x22">0x22 - 机械角度当前值</option>
                            <option value="0x23">0x23 - 控制模式</option>
                            <option value="0x24">0x24 - 接口模式</option>
                            <option value="0x25">0x25 - 工作状态</option>
                            <option value="0x26">0x26 - 力矩环PID Kp</option>
                            <option value="0x27">0x27 - 力矩环PID Ki</option>
                            <option value="0x28">0x28 - 力矩环PID Kd</option>
                            <option value="0x29">0x29 - 速度环PID Kp</option>
                            <option value="0x2A">0x2A - 速度环PID Ki</option>
                            <option value="0x2B">0x2B - 速度环PID Kd</option>
                            <option value="0x2C">0x2C - 位置环PID Kp</option>
                            <option value="0x2D">0x2D - 位置环PID Ki</option>
                            <option value="0x2E">0x2E - 位置环PID Kd</option>
                            <option value="0x30">0x30 - CAN ID号</option>
                            <option value="0x31">0x31 - 机械零位角度</option>
                        </select>
                    </div>

                    <!-- 数据类型显示 -->
                    <div class="data-type-display">
                        <label>数据类型:</label>
                        <span id="data-type-label">float</span>
                    </div>

                    <!-- 数据输入/输出区域 -->
                    <div class="data-value-area">
                        <label id="data-value-label">数据值:</label>
                        <input type="text" id="data-value-input" placeholder="输入数值" class="data-input">
                        <div id="data-value-display" class="data-display" style="display: none;"></div>
                    </div>

                    <!-- 结果显示区域 -->
                    <div class="rw-result-area">
                        <label>执行结果:</label>
                        <div id="rw-result-display" class="result-display"></div>
                    </div>
                    
                    <!-- 操作按钮 -->
                    <div class="rw-controls">
                        <button id="execute-rw-btn" class="control-btn">读取数据</button>
                        <button id="clear-rw-btn" class="control-btn">清空</button>
                    </div>
                </div>
            </aside>
        </main>

        <!-- 底部状态栏 -->
        <footer class="footer">
            <div class="status-info">
                <span id="current-time">--:--:--</span>
                <span id="data-points">数据点: 0</span>
                <span id="memory-usage">内存: -- MB</span>
            </div>
        </footer>
    </div>

    <!-- 日志窗口 -->
    <div class="logger-window" id="logger-window">
        <div class="logger-header">
            <h3>系统日志</h3>
            <div class="logger-controls">
                <button id="clear-logs-btn" class="logger-btn">清空</button>
                <button id="close-logs-btn" class="logger-btn">关闭</button>
            </div>
        </div>
        <div class="logger-content" id="logger-content">
            <div class="logger-placeholder">暂无日志记录</div>
        </div>
        <div class="logger-footer">
            <span id="log-count">0 条记录</span>
            <button id="export-logs-btn" class="logger-btn">导出日志</button>
        </div>
    </div>

    <!-- JavaScript文件 -->
    <script src="../assets/chart.js"></script>
    <script src="../utils/serial.js"></script>
    <script src="../utils/chartManager.js"></script>
    <script src="../components/visibilityManager.js"></script>
    <script src="../components/visibilityPanel.js"></script>
    <script src="../utils/logger.js"></script>
    
    <script type="module" src="../utils/dataCommunication.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
