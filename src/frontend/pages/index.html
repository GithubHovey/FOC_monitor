<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:">
    <title>FOC电机控制上位机</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部菜单栏 -->
        <header class="header">
            <div class="logo">
                <h1>FOC电机控制上位机</h1>
            </div>
            <nav class="menu">
                <button class="menu-item" data-page="monitor">实时监控</button>
                <button class="menu-item" data-page="control">控制设置</button>
                <button class="menu-item" data-page="config">参数配置</button>
                <button class="menu-item" data-page="history">历史数据</button>
                <button id="visibility-btn" class="menu-item visibility-btn">可视性控制</button>
            </nav>
            <div class="status-bar">
                <span id="connection-status" class="status-offline">未连接</span>
                <span id="data-rate">0 Hz</span>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 左侧曲线选择侧边栏 -->
            <aside class="sidebar">
                <div class="curve-selection">
                    <h3>打印曲线选择</h3>
                    <div class="curve-controls" id="curve-controls">
                        <!-- 曲线选择控件将通过JS动态生成 -->
                    </div>
                </div>
                
                <!-- 串口配置（移到曲线选择下方） -->
                <div class="serial-config">
                    <h3>串口配置</h3>
                    <div class="serial-settings">
                        <select id="serial-port-select">
                            <option value="">选择串口</option>
                        </select>
                        <select id="baud-rate-select">
                            <option value="9600">9600</option>
                            <option value="19200">19200</option>
                            <option value="38400">38400</option>
                            <option value="57600">57600</option>
                            <option value="115200" selected>115200</option>
                            <option value="1500000">1.5M</option>
                        </select>
                        <button id="connect-btn" class="connect-btn">连接</button>
                    </div>
                </div>
            </aside>

            <!-- 中部图表区域 -->
            <section class="chart-area">
                <div class="chart-tabs">
                    <button class="tab-btn active" data-tab="current">电流参数</button>
                    <button class="tab-btn" data-tab="voltage">电压参数</button>
                    <button class="tab-btn" data-tab="speed">转速参数</button>
                    <button class="tab-btn" data-tab="position">位置参数</button>
                </div>
                
                <div class="chart-container">
                    <canvas id="main-chart" width="800" height="400"></canvas>
                </div>
                
                <div class="chart-controls">
                    <button id="pause-btn" class="control-btn">暂停</button>
                    <button id="clear-btn" class="control-btn">清除</button>
                    <button id="export-btn" class="control-btn">导出数据</button>
                    <div class="time-range">
                        <label>时间范围：</label>
                        <select id="time-range-select">
                            <option value="10">10秒</option>
                            <option value="30" selected>30秒</option>
                            <option value="60">60秒</option>
                            <option value="300">5分钟</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- 右侧数据发送面板 -->
            <aside class="data-sender-panel">
                <!-- 1. 控制终端 -->
                <div class="control-terminal">
                    <h3>控制终端</h3>
                    <div class="sender-controls">
                        <select id="data-format-select">
                            <option value="hex">十六进制</option>
                            <option value="ascii">ASCII</option>
                            <option value="utf8">UTF-8</option>
                            <option value="decimal">十进制</option>
                            <option value="binary">二进制</option>
                        </select>
                        <textarea id="custom-data-input" placeholder="输入要发送的数据..."></textarea>
                        <button id="send-data-btn" class="send-btn">发送数据</button>
                        <button id="clear-data-btn" class="clear-btn">清除</button>
                    </div>
                </div>

                <!-- 2. 模式设置 -->
                <div class="mode-controls">
                    <h3>模式设置</h3>
                    
                    <!-- 模式选择 -->
                    <div class="mode-selector">
                        <label>控制模式:</label>
                        <select id="control-mode-select">
                            <option value="torque">力矩模式</option>
                            <option value="speed">速度模式</option>
                            <option value="position">位置模式</option>
                            <option value="calibration">校准模式</option>
                        </select>
                    </div>

                    <!-- 力矩模式控制 -->
                    <div class="mode-control torque-mode" style="display: none;">
                        <h4>力矩控制</h4>
                        <div class="slider-control">
                            <label>力矩值: <span id="torque-value">0</span>%</label>
                            <input type="range" id="torque-slider" min="0" max="100" value="0" step="1">
                        </div>
                        <button id="send-torque-btn" class="send-btn">发送力矩指令</button>
                    </div>

                    <!-- 速度模式控制 -->
                    <div class="mode-control speed-mode" style="display: none;">
                        <h4>速度控制</h4>
                        <div class="slider-control">
                            <label>速度值: <span id="speed-value">0</span>%</label>
                            <input type="range" id="speed-slider" min="0" max="100" value="0" step="1">
                        </div>
                        <button id="send-speed-btn" class="send-btn">发送速度指令</button>
                    </div>

                    <!-- 位置模式控制 -->
                    <div class="mode-control position-mode" style="display: none;">
                        <h4>位置控制</h4>
                        <div class="slider-control">
                            <label>位置值: <span id="position-value">0.0</span>°</label>
                            <input type="range" id="position-slider" min="0" max="360" value="0" step="0.1">
                        </div>
                        <button id="send-position-btn" class="send-btn">发送位置指令</button>
                    </div>

                    <!-- 校准模式控制 -->
                    <div class="mode-control calibration-mode" style="display: none;">
                        <h4>校准模式</h4>
                        <button id="send-calibration-btn" class="send-btn">发送校准指令</button>
                    </div>
                </div>
            </aside>
        </main>

        <!-- 底部状态栏 -->
        <footer class="footer">
            <div class="status-info">
                <span id="current-time">--:--:--</span>
                <span id="data-points">数据点: 0</span>
                <span id="memory-usage">内存: -- MB</span>
            </div>
        </footer>
    </div>

    <!-- JavaScript文件 -->
    <script src="../assets/chart.js"></script>
    <script src="../utils/serial.js"></script>
    <script src="../utils/chartManager.js"></script>
    <script src="../components/visibilityManager.js"></script>
    <script src="../components/visibilityPanel.js"></script>
    <script src="../components/controlTerminal.js"></script>
    <script src="main.js"></script>
</body>
</html>
