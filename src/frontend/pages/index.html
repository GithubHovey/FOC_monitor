<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOC电机控制上位机</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 顶部菜单栏 -->
        <header class="header">
            <div class="logo">
                <h1>FOC电机控制上位机</h1>
            </div>
            <nav class="menu">
                <button class="menu-item" data-page="monitor">实时监控</button>
                <button class="menu-item" data-page="control">控制设置</button>
                <button class="menu-item" data-page="config">参数配置</button>
                <button class="menu-item" data-page="history">历史数据</button>
            </nav>
            <div class="status-bar">
                <span id="connection-status" class="status-offline">未连接</span>
                <span id="data-rate">0 Hz</span>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 左侧设备树和参数列表 -->
            <aside class="sidebar">
                <div class="device-tree">
                    <h3>设备列表</h3>
                    <div class="device-list" id="device-list">
                        <!-- 设备列表将通过JS动态生成 -->
                    </div>
                </div>
                
                <div class="parameter-list">
                    <h3>监控参数</h3>
                    <div class="parameter-controls" id="parameter-controls">
                        <!-- 参数选择控件将通过JS动态生成 -->
                    </div>
                </div>
            </aside>

            <!-- 中部图表区域 -->
            <section class="chart-area">
                <div class="chart-tabs">
                    <button class="tab-btn active" data-tab="current">电流参数</button>
                    <button class="tab-btn" data-tab="voltage">电压参数</button>
                    <button class="tab-btn" data-tab="speed">转速参数</button>
                    <button class="tab-btn" data-tab="position">位置参数</button>
                </div>
                
                <div class="chart-container">
                    <canvas id="main-chart" width="800" height="400"></canvas>
                </div>
                
                <div class="chart-controls">
                    <button id="pause-btn" class="control-btn">暂停</button>
                    <button id="clear-btn" class="control-btn">清除</button>
                    <button id="export-btn" class="control-btn">导出数据</button>
                    <div class="time-range">
                        <label>时间范围：</label>
                        <select id="time-range-select">
                            <option value="10">10秒</option>
                            <option value="30" selected>30秒</option>
                            <option value="60">60秒</option>
                            <option value="300">5分钟</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- 右侧控制面板 -->
            <aside class="control-panel">
                <div class="control-mode">
                    <h3>控制模式</h3>
                    <div class="mode-selector">
                        <label class="radio-label">
                            <input type="radio" name="control-mode" value="speed" checked>
                            速度模式
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="control-mode" value="position">
                            位置模式
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="control-mode" value="torque">
                            力矩模式
                        </label>
                    </div>
                </div>

                <div class="pid-controls" id="pid-controls">
                    <!-- PID参数控制将通过JS动态生成 -->
                </div>

                <div class="target-control">
                    <h3>目标值设置</h3>
                    <div class="target-input">
                        <label for="target-value">目标值：</label>
                        <input type="number" id="target-value" step="0.1">
                        <button id="set-target-btn">设置</button>
                    </div>
                </div>

                <div class="serial-config">
                    <h3>串口配置</h3>
                    <div class="serial-settings">
                        <select id="serial-port-select">
                            <option value="">选择串口</option>
                        </select>
                        <select id="baud-rate-select">
                            <option value="9600">9600</option>
                            <option value="19200">19200</option>
                            <option value="38400">38400</option>
                            <option value="57600">57600</option>
                            <option value="115200" selected>115200</option>
                        </select>
                        <button id="connect-btn" class="connect-btn">连接</button>
                    </div>
                </div>
            </aside>
        </main>

        <!-- 底部状态栏 -->
        <footer class="footer">
            <div class="status-info">
                <span id="current-time">--:--:--</span>
                <span id="data-points">数据点: 0</span>
                <span id="memory-usage">内存: -- MB</span>
            </div>
        </footer>
    </div>

    <!-- JavaScript文件 -->
    <script src="../utils/serial.js"></script>
    <script src="../utils/chartManager.js"></script>
    <script src="../utils/dataProcessor.js"></script>
    <script src="../components/deviceManager.js"></script>
    <script src="../components/controlManager.js"></script>
    <script src="../components/configManager.js"></script>
    <script src="main.js"></script>
</body>
</html>
