<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视窗系统测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .viewport-container {
            width: 800px;
            height: 400px;
            border: 2px solid #333;
            border-radius: 8px;
            background: white;
            position: relative;
            margin: 20px auto;
            overflow: hidden;
        }

        .viewport-content {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .chart-canvas {
            position: absolute;
            cursor: grab;
            transition: none;
        }

        .chart-canvas:active {
            cursor: grabbing;
        }

        .x-scrollbar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
        }

        .y-scrollbar-container {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 20px;
            width: 20px;
            background: #f5f5f5;
            border-left: 1px solid #ddd;
        }

        .viewport-scrollbar {
            position: absolute;
            background: #ccc;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .viewport-scrollbar:hover {
            background: #999;
            cursor: grab;
        }

        .viewport-scrollbar:active {
            background: #666;
            cursor: grabbing;
        }

        .x-scrollbar {
            height: 16px;
            bottom: 2px;
            border-radius: 8px;
            cursor: pointer;
        }

        .y-scrollbar {
            width: 16px;
            right: 2px;
            border-radius: 8px;
            cursor: pointer;
        }

        .viewport-controls {
            position: absolute;
            top: 10px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .control-btn {
            padding: 5px 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .control-btn:hover {
            background: #0056b3;
        }

        .range-display {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1>视窗系统测试</h1>
    <p>使用鼠标拖拽图表，滚轮缩放，右侧和下侧滚动条控制视图位置</p>

    <div class="viewport-container">
        <div class="viewport-content">
            <canvas id="test-chart" class="chart-canvas" width="2400" height="1310"></canvas>
        </div>
        
        <!-- X轴滚动条 -->
        <div class="x-scrollbar-container">
            <div class="viewport-scrollbar x-scrollbar" id="x-scrollbar"></div>
        </div>
        
        <!-- Y轴滚动条 -->
        <div class="y-scrollbar-container">
            <div class="viewport-scrollbar y-scrollbar" id="y-scrollbar"></div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="viewport-controls">
            <button class="control-btn" onclick="resetView()">重置视图</button>
            <button class="control-btn" onclick="fitToData()">适应数据</button>
            <button class="control-btn" onclick="viewport.logger.export()" style="background: #28a745;">导出日志</button>
            <button class="control-btn" onclick="viewport.logger.clear()" style="background: #dc3545;">清空日志</button>
        </div>
        
        <!-- 范围显示 -->
        <div class="range-display">
            <div>X: <span id="x-range">0-100</span></div>
            <div>Y: <span id="y-range">-100-100</span></div>
        </div>
    </div>

    <script>
        // 开发者日志系统
        class DevLogger {
            constructor() {
                this.logs = [];
                this.maxLogs = 1000;
                this.logFileName = 'scroll_debug.log';
                
                // 清空之前的日志
                this.clear();
                console.log('开发者日志系统已启动');
            }
            
            log(level, message, data = null) {
                const timestamp = new Date().toLocaleString();
                const logEntry = {
                    timestamp,
                    level,
                    message,
                    data
                };
                
                this.logs.push(logEntry);
                
                if (this.logs.length > this.maxLogs) {
                    this.logs.shift();
                }
                
                // 格式化日志行
                const logLine = `[${timestamp}] ${level.toUpperCase()}: ${message}`;
                const logData = data ? ` ${JSON.stringify(data, null, 2)}` : '';
                
                // 输出到控制台
                console.group(logLine);
                if (data) console.log(JSON.stringify(data, null, 2));
                console.groupEnd();
                
                // 收集日志用于导出
                this.collectLogsForExport();
            }
            
            collectLogsForExport() {
                // 创建一个文本区域用于复制日志
                if (!window.logTextArea) {
                    window.logTextArea = document.createElement('textarea');
                    window.logTextArea.id = 'debug-log-area';
                    window.logTextArea.style.position = 'fixed';
                    window.logTextArea.style.top = '10px';
                    window.logTextArea.style.right = '10px';
                    window.logTextArea.style.width = '300px';
                    window.logTextArea.style.height = '200px';
                    window.logTextArea.style.zIndex = '10000';
                    window.logTextArea.style.fontSize = '10px';
                    window.logTextArea.style.backgroundColor = '#f0f0f0';
                    window.logTextArea.readOnly = true;
                    document.body.appendChild(window.logTextArea);
                }
                
                const logContent = this.logs.map(log => 
                    `[${log.timestamp}] ${log.level.toUpperCase()}: ${log.message}` +
                    (log.data ? `\n${JSON.stringify(log.data, null, 2)}` : '')
                ).join('\n\n');
                
                window.logTextArea.value = logContent;
            }
            
            export() {
                const logContent = this.logs.map(log => 
                    `[${log.timestamp}] ${log.level.toUpperCase()}: ${log.message}` +
                    (log.data ? ` ${JSON.stringify(log.data)}` : '')
                ).join('\n');
                
                // 创建下载链接
                const blob = new Blob([logContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = this.logFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                console.log('日志已导出为文件:', this.logFileName);
                return logContent;
            }
            
            clear() {
                this.logs = [];
                if (window.logTextArea) {
                    window.logTextArea.value = '';
                }
                console.log('日志已清空');
            }
            
            getLogs() {
                return this.logs;
            }
        }

        // 简单的视窗系统实现
        class ViewportSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.logger = new DevLogger();
                this.isDragging = false;
                this.lastMouseX = 0;
                this.lastMouseY = 0;
                this.offsetX = 0;
                this.offsetY = 0;
                this.scale = 1;
                
                // 数据范围 - 根据FOC电机控制需求
                this.dataXMin = 0;
                this.dataXMax = 20000; // 初始X轴范围20000ms
                this.dataYMin = -65535;
                this.dataYMax = 65535;
                
                this.logger.log('info', 'ViewportSystem初始化', {
                    canvasSize: { width: canvas.width, height: canvas.height },
                    dataRange: { x: [this.dataXMin, this.dataXMax], y: [this.dataYMin, this.dataYMax] }
                });
                
                // 立即保存日志文件
                this.logger.saveToFile();
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.drawTestChart();
                this.resetView(); // 使用resetView设置初始视窗范围
                this.updateScrollbars();
                this.updateRangeDisplay();
            }

            setupEventListeners() {
                // 鼠标拖拽
                this.canvas.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                    this.canvas.style.cursor = 'grabbing';
                    e.preventDefault(); // 添加阻止默认行为
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;
                    
                    const deltaX = e.clientX - this.lastMouseX;
                    const deltaY = e.clientY - this.lastMouseY;
                    
                    this.offsetX += deltaX / this.scale;
                    this.offsetY -= deltaY / this.scale;
                    
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                    
                    this.constrainOffset();
                    this.updateCanvasPosition();
                    this.updateScrollbars();
                    this.updateRangeDisplay();
                });

                document.addEventListener('mouseup', () => {
                    this.isDragging = false;
                    this.canvas.style.cursor = 'grab';
                });

                // 滚轮缩放 - 以鼠标坐标为中心，保持鼠标位置不变
                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    
                    const rect = this.canvas.parentElement.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    
                    const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                    
                    // 计算当前鼠标对应的数据坐标
                    const dataMouseX = this.offsetX + mouseX / this.scale;
                    const dataMouseY = this.offsetY + mouseY / this.scale;
                    
                    // 计算新的缩放比例，考虑边界限制
                    const newScale = Math.max(
                        Math.max(
                            this.canvas.parentElement.clientWidth / (this.dataXMax - this.dataXMin),
                            this.canvas.parentElement.clientHeight / (this.dataYMax - this.dataYMin)
                        ),
                        Math.min(100, this.scale * zoomFactor)
                    );
                    
                    // 计算新的偏移量，确保鼠标位置的数据坐标保持不变
                    this.offsetX = dataMouseX - mouseX / newScale;
                    this.offsetY = dataMouseY - mouseY / newScale;
                    
                    this.scale = newScale;
                    
                    this.constrainOffset();
                    this.updateCanvasPosition();
                    this.updateScrollbars();
                    this.updateRangeDisplay();
                });

                // 滚动条事件
                const xScrollbar = document.getElementById('x-scrollbar');
                const yScrollbar = document.getElementById('y-scrollbar');

                xScrollbar.addEventListener('mousedown', (e) => {
                    this.startScrollbarDrag(e, 'x');
                });

                yScrollbar.addEventListener('mousedown', (e) => {
                    this.startScrollbarDrag(e, 'y');
                });
            }

            startScrollbarDrag(e, axis) {
                const isX = axis === 'x';
                const scrollbar = isX ? document.getElementById('x-scrollbar') : document.getElementById('y-scrollbar');
                const container = scrollbar.parentElement;
                
                e.preventDefault();
                e.stopPropagation();
                
                const rect = container.getBoundingClientRect();
                const scrollbarRect = scrollbar.getBoundingClientRect();
                
                this.logger.log('info', '滚动条点击开始', {
                    axis,
                    eventType: e.type,
                    clickPosition: { x: e.clientX, y: e.clientY },
                    scrollbarPosition: {
                        top: scrollbar.offsetTop,
                        left: scrollbar.offsetLeft,
                        width: scrollbar.offsetWidth,
                        height: scrollbar.offsetHeight
                    },
                    containerSize: {
                        width: container.clientWidth,
                        height: container.clientHeight
                    },
                    containerRect: {
                        top: rect.top,
                        left: rect.left,
                        width: rect.width,
                        height: rect.height
                    },
                    scrollbarRect: {
                        top: scrollbarRect.top,
                        left: scrollbarRect.left,
                        width: scrollbarRect.width,
                        height: scrollbarRect.height
                    },
                    currentOffset: { x: this.offsetX, y: this.offsetY },
                    currentScale: this.scale,
                    dataRange: { x: [this.dataXMin, this.dataXMax], y: [this.dataYMin, this.dataYMax] }
                });
                
                const startMouseX = e.clientX;
                const startMouseY = e.clientY;
                const startLeft = scrollbar.offsetLeft;
                const startTop = scrollbar.offsetTop;
                
                const onMouseMove = (e2) => {
                    e2.preventDefault();
                    
                    const rect = container.getBoundingClientRect();
                    let ratio;
                    
                    if (isX) {
                        // X轴滚动条：计算相对于容器的位置比例
                        const maxLeft = rect.width - scrollbar.offsetWidth;
                        const newLeft = Math.max(0, Math.min(maxLeft, startLeft + (e2.clientX - startMouseX)));
                        ratio = maxLeft > 0 ? newLeft / maxLeft : 0;
                        
                        // 更新滚动条位置
                        scrollbar.style.left = newLeft + 'px';
                        
                        // 计算对应的偏移量
                        const totalWidth = (this.dataXMax - this.dataXMin) * this.scale;
                        const viewWidth = this.canvas.parentElement.clientWidth;
                        this.offsetX = Math.max(0, Math.min(totalWidth - viewWidth, ratio * Math.max(0, totalWidth - viewWidth)));
                        
                    } else {
                        // Y轴滚动条：计算相对于容器的位置比例
                        const maxTop = rect.height - scrollbar.offsetHeight;
                        const newTop = Math.max(0, Math.min(maxTop, startTop + (e2.clientY - startMouseY)));
                        ratio = maxTop > 0 ? newTop / maxTop : 0;
                        
                        const totalHeight = (this.dataYMax - this.dataYMin) * this.scale;
                        const viewHeight = this.canvas.parentElement.clientHeight;
                        const maxScroll = totalHeight - viewHeight;
                        const newOffsetY = Math.max(0, Math.min(maxScroll, ratio * maxScroll));
                        
                        this.logger.log('debug', 'Y轴拖拽计算', {
                            mouseY: e2.clientY,
                            startMouseY,
                            startTop,
                            newTop,
                            ratio,
                            maxTop,
                            totalHeight,
                            viewHeight,
                            maxScroll,
                            oldOffsetY: this.offsetY,
                            newOffsetY,
                            deltaOffsetY: newOffsetY - this.offsetY
                        });
                        
                        // 更新滚动条位置
                        scrollbar.style.top = newTop + 'px';
                        this.offsetY = newOffsetY;
                    }
                    
                    console.log('约束前offsetY:', this.offsetY);
                    this.constrainOffset();
                    console.log('约束后offsetY:', this.offsetY);
                    this.updateCanvasPosition();
                    this.updateRangeDisplay();
                };

                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            }

            constrainOffset() {
                const viewWidth = this.canvas.parentElement.clientWidth;
                const viewHeight = this.canvas.parentElement.clientHeight;
                
                const maxOffsetX = Math.max(0, (this.dataXMax - this.dataXMin) * this.scale - viewWidth);
                const maxOffsetY = Math.max(0, (this.dataYMax - this.dataYMin) * this.scale - viewHeight);
                
                this.offsetX = Math.max(0, Math.min(maxOffsetX, this.offsetX));
                this.offsetY = Math.max(0, Math.min(maxOffsetY, this.offsetY));
            }

            updateCanvasPosition() {
                this.canvas.style.transform = `translate(${-this.offsetX}px, ${-this.offsetY}px)`;
            }

            updateScrollbars() {
                const viewWidth = this.canvas.parentElement.clientWidth;
                const viewHeight = this.canvas.parentElement.clientHeight;
                
                const totalWidth = (this.dataXMax - this.dataXMin) * this.scale;
                const totalHeight = (this.dataYMax - this.dataYMin) * this.scale;
                
                // X轴滚动条
                let xScrollbarData = null;
                if (totalWidth > viewWidth) {
                    const xRatio = viewWidth / totalWidth;
                    const xThumbWidth = Math.max(20, viewWidth * xRatio);
                    const maxScroll = totalWidth - viewWidth;
                    const xThumbLeft = maxScroll > 0 ? (this.offsetX / maxScroll) * (viewWidth - xThumbWidth) : 0;
                    
                    const xScrollbar = document.getElementById('x-scrollbar');
                    xScrollbar.style.width = xThumbWidth + 'px';
                    xScrollbar.style.left = Math.max(0, Math.min(viewWidth - xThumbWidth, xThumbLeft)) + 'px';
                    xScrollbar.style.display = 'block';
                    
                    xScrollbarData = {
                        ratio: xRatio,
                        thumbWidth: xThumbWidth,
                        thumbLeft: xThumbLeft,
                        maxScroll: maxScroll
                    };
                } else {
                    document.getElementById('x-scrollbar').style.display = 'none';
                }
                
                // Y轴滚动条
                let yScrollbarData = null;
                if (totalHeight > viewHeight) {
                    const yRatio = viewHeight / totalHeight;
                    const yThumbHeight = Math.max(20, viewHeight * yRatio);
                    const maxScroll = totalHeight - viewHeight;
                    const yThumbTop = maxScroll > 0 ? (this.offsetY / maxScroll) * (viewHeight - yThumbHeight) : 0;
                    
                    const yScrollbar = document.getElementById('y-scrollbar');
                    yScrollbar.style.height = yThumbHeight + 'px';
                    yScrollbar.style.top = Math.max(0, Math.min(viewHeight - yThumbHeight, yThumbTop)) + 'px';
                    yScrollbar.style.display = 'block';
                    
                    yScrollbarData = {
                        ratio: yRatio,
                        thumbHeight: yThumbHeight,
                        thumbTop: yThumbTop,
                        maxScroll: maxScroll,
                        offsetRatio: maxScroll > 0 ? this.offsetY / maxScroll : 0
                    };
                } else {
                    document.getElementById('y-scrollbar').style.display = 'none';
                }
                
                this.logger.log('debug', '滚动条位置更新', {
                    viewSize: { width: viewWidth, height: viewHeight },
                    totalSize: { width: totalWidth, height: totalHeight },
                    currentOffsets: { x: this.offsetX, y: this.offsetY },
                    xScrollbar: xScrollbarData,
                    yScrollbar: yScrollbarData
                });
            }

            updateRangeDisplay() {
                const viewWidth = this.canvas.parentElement.clientWidth;
                const viewHeight = this.canvas.parentElement.clientHeight;
                
                const xStart = this.offsetX / this.scale;
                const xEnd = (this.offsetX + viewWidth) / this.scale;
                const yStart = this.offsetY / this.scale;
                const yEnd = (this.offsetY + viewHeight) / this.scale;
                
                document.getElementById('x-range').textContent = `${xStart.toFixed(1)}-${xEnd.toFixed(1)}`;
                document.getElementById('y-range').textContent = `${yStart.toFixed(1)}-${yEnd.toFixed(1)}`;
            }

            drawTestChart() {
                // 绘制测试图表 - 适应FOC电机控制数据范围
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 计算坐标映射
                const yRange = this.dataYMax - this.dataYMin;
                const yScale = this.canvas.height / yRange;
                const xScale = this.canvas.width / (this.dataXMax - this.dataXMin);
                
                // 绘制网格 - 根据新的数据范围调整
                this.ctx.strokeStyle = '#e0e0e0';
                this.ctx.lineWidth = 1;
                
                // 垂直网格线 - 每1000ms一条线
                const xStep = 1000 * xScale;
                for (let x = 0; x <= this.canvas.width; x += xStep) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                    
                    // 添加X轴标签
                    this.ctx.fillStyle = '#666';
                    this.ctx.font = '10px Arial';
                    this.ctx.textAlign = 'center';
                    const timeMs = x / xScale;
                    this.ctx.fillText(timeMs.toString(), x, this.canvas.height - 2);
                }
                
                // 水平网格线 - 每10000一条线
                const yStep = 10000 * yScale;
                for (let y = 0; y <= this.canvas.height; y += yStep) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                    
                    // 添加Y轴标签
                    this.ctx.fillStyle = '#666';
                    this.ctx.font = '10px Arial';
                    this.ctx.textAlign = 'right';
                    const value = this.dataYMax - (y / yScale);
                    this.ctx.fillText(value.toString(), -2, y + 3);
                }
                
                // 绘制测试波形 - 模拟FOC电机数据
                this.ctx.strokeStyle = '#007bff';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                
                for (let x = 0; x < this.canvas.width; x++) {
                    // 将数据值映射到画布坐标
                    const timeMs = x / xScale;
                    const dataValue = Math.sin(timeMs * 0.001) * 30000 + Math.sin(timeMs * 0.003) * 15000;
                    const y = this.canvas.height - ((dataValue - this.dataYMin) / yRange) * this.canvas.height;
                    
                    if (x === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
                
                // 绘制坐标轴
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 2;
                
                // X轴 (Y=0位置)
                const zeroY = this.canvas.height - ((0 - this.dataYMin) / yRange) * this.canvas.height;
                this.ctx.beginPath();
                this.ctx.moveTo(0, zeroY);
                this.ctx.lineTo(this.canvas.width, zeroY);
                this.ctx.stroke();
                
                // Y轴 (X=0位置)
                this.ctx.beginPath();
                this.ctx.moveTo(0, 0);
                this.ctx.lineTo(0, this.canvas.height);
                this.ctx.stroke();
                
                // 绘制数据边界框
                this.ctx.strokeStyle = '#ff0000';
                this.ctx.lineWidth = 1;
                this.ctx.setLineDash([5, 5]);
                this.ctx.strokeRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.setLineDash([]);
            }

            resetView() {
                // 重置到指定的初始视窗范围
                const viewWidth = this.canvas.parentElement.clientWidth;
                const viewHeight = this.canvas.parentElement.clientHeight;
                
                // X轴初始可视范围: 0~10000
                const initialXRange = 10000;
                this.scale = viewWidth / initialXRange;
                this.offsetX = 0;
                
                // Y轴初始可视范围: -5000~5000 (即中心位置)
                const initialYRange = 10000;
                const yScale = viewHeight / initialYRange;
                this.scale = Math.min(this.scale, yScale);
                
                // 计算Y轴偏移，使-5000~5000居中显示
                const yCenterOffset = (this.dataYMax + this.dataYMin) / 2;
                this.offsetY = (yCenterOffset - this.dataYMin) * this.scale - viewHeight / 2;
                
                this.updateCanvasPosition();
                this.updateScrollbars();
                this.updateRangeDisplay();
            }

            fitToData() {
                const viewWidth = this.canvas.parentElement.clientWidth;
                const viewHeight = this.canvas.parentElement.clientHeight;
                
                this.scale = Math.min(
                    viewWidth / (this.dataXMax - this.dataXMin),
                    viewHeight / (this.dataYMax - this.dataYMin)
                );
                
                this.offsetX = 0;
                this.offsetY = 0;
                
                this.updateCanvasPosition();
                this.updateScrollbars();
                this.updateRangeDisplay();
            }
        }

        // 初始化
        const canvas = document.getElementById('test-chart');
        const viewport = new ViewportSystem(canvas);

        // 全局函数
        function resetView() {
            viewport.resetView();
        }

        function fitToData() {
            viewport.fitToData();
        }
    </script>
</body>
</html>
